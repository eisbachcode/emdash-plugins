# Runs every plugin suite against every EmDash version we claim to support.
#
# Deliberately NOT named emdash-release.yml: `emdash-plugin release setup`
# generates that file, and this must not collide with it.
#
# Two jobs, because they answer different questions:
#
#   declared  gating. The versions inside our published range. A failure here
#             is our regression and blocks the branch.
#   latest    informational, never blocks. Runs against whatever EmDash is
#             current on npm. EmDash ships a minor every 6-8 days and any minor
#             may carry breaking changes, so this is the signal to widen the
#             tested-up-to tables in the package READMEs -- or not to.
name: compat matrix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Monday 06:00 UTC. EmDash releases land mid-week, so this reports on the
    # previous week's minor before the next one arrives.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  declared:
    name: declared range
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The whole point of committing .nvmrc: one file decides the Node
          # version here, on a laptop via fnm, and on Cloudflare Workers Builds.
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: ./scripts/compat-matrix.sh 0.39.1 0.40.0

  latest:
    name: current EmDash (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: resolve
        # dist-tags.latest, not the highest semver: emdash@1.0.0 exists on npm
        # but was published 2026-04-27 and deprecated, and it outranks every
        # real 0.x release in semver order.
        run: echo "version=$(npm view emdash dist-tags.latest)" >> "$GITHUB_OUTPUT"
      - run: |
          echo "current EmDash on npm: ${{ steps.resolve.outputs.version }}"
          ./scripts/compat-matrix.sh "${{ steps.resolve.outputs.version }}"
